<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GidHub 示例站点</title><style>
:root{--accent:#1f883d;--ink:#1f2328;--muted:#59636e;--line:#d8dee4}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.wrap{max-width:820px;margin:0 auto;padding:0 28px}
header{padding:28px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:700 15px/1 ui-monospace,monospace;letter-spacing:.08em;color:var(--accent)}
header a{font-size:13px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:12px}footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
main{padding:72px 0 84px}.bar{width:56px;height:5px;background:var(--accent);border-radius:3px;margin-bottom:26px}
h1{font-size:46px;line-height:1.1;letter-spacing:-1.2px;margin:0 0 14px}p.lead{font-size:18px;color:var(--muted);margin:0 0 34px;max-width:560px}p.body{max-width:600px;font-size:16px;color:#3d444d;line-height:1.8}
</style></head><body><div class="wrap"><header><span class="brand">GIDHUB DEMO</span><a href="https://acmagnus.github.io/gidhub/">用 GidHub 建站</a></header>
<main><div class="bar"></div><h1>GidHub 示例站点</h1><p class="lead">这是 GidHub 在 GitHub Pages 上生成的示例站点。</p><p class="body">在 GidHub 填一个标题、一句话介绍，选一个模板，它会创建仓库、提交文件、开启 Pages，然后给你一个能直接打开的网址。</p><p style="margin-top:36px"><a style="font-weight:600" href="https://acmagnus.github.io/gidhub/">去 GidHub 建一个 →</a></p></main>
<footer><div class="wrap"><span>GidHub 示例站点</span><span>Built on GitHub Pages</span></div></footer></div></body></html>
